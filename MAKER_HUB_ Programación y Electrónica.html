<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#050005;--red:#ff1f3d;--v:#a855f7;--y:#ffd60a;--text:#f3e8ea}

.row{display:grid;grid-template-columns:1fr 1fr;gap:clamp(10px,3vw,28px)}
.big{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;text-decoration:none;min-height:min(58vh,460px);padding:14px;border-radius:10px;background:rgba(5,0,5,.82);border:3px solid var(--c);color:var(--c);box-shadow:0 0 26px var(--g);transition:.2s}

<main>

<script>
const c=document.getElementById("m"),x=c.getContext("2d"),ch="アイウエオカキクケコサシスセソタチツテト0123456789ABCDEF<>/{}[]";let d=[];
function size(){c.width=innerWidth;c.height=innerHeight;d=Array(Math.floor(c.width/16)).fill(0).map(()=>-Math.random()*60|0)}
function draw(){x.fillStyle="rgba(5,0,5,.09)";x.fillRect(0,0,c.width,c.height);x.fillStyle="#ff1f3d";x.font="15px monospace";
 d.forEach((y,i)=>{x.fillText(ch[Math.random()*ch.length|0],i*16,y*16);d[i]=y*16>c.height&&Math.random()>.975?0:y+1})}
if(!matchMedia("(prefers-reduced-motion:reduce)").matches){size();addEventListener("resize",size);setInterval(draw,50)}
</script></body></html>
